<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Landlord</title>
  <link rel="stylesheet" href="css/styles.css"> 
</head>
<body>
  <script src="js/script.js"></script>
</body>
</html>

  <header class="topbar">
    <div class="logo">UniNest</div>
    <nav class="nav-links">
      <a href="listings.html">Listings</a>
      <a href="contact.html">Contact</a>
      <a href="#">Profile</a>
      <a href="#">Logout</a>
    </nav>
    <div class="search-bar">
      <input type="text" placeholder="Search properties...">
      <button>Search</button>
    </div>
  </header>

  <!-- Page Title -->
  <h1 class="page-title">Contact Landlord</h1>

  <div class="container">

    <!-- Left side: Property details -->
    <div class="property-box">
      <h2>Cozy Studio Apartment</h2>
      <p><strong>Location:</strong> Cape Town</p>
      <p><strong>Price:</strong> R8,500/month</p>
      <span class="available">Available</span>
    </div>

    <!-- Right side: Landlord info + form -->
    <div class="form-box">
      <h3>Landlord Information</h3>
      <p><strong>Name:</strong> James Smith</p>
      <p><strong>Phone:</strong> 082 154 6897</p>
      <p><strong>Email:</strong> smithjames@gmail.com</p>

      <form id="contactForm">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" name="studentName" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <div class="buttons">
          <button type="submit" class="send">Send Message</button>
          <button type="reset" class="cancel">Cancel</button>
        </div>
      </form>

      <!-- Success notification -->
      <div id="successBar" class="success-bar">Message sent successfully!</div>
    </div>

  </div>

</body>
</html>
