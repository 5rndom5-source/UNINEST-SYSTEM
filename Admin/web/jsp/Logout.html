<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - UniNest Admin Portal</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
        }

        .logout-container {
            background: var(--white);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logout-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .logout-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .logout-message {
            color: var(--gray);
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .logout-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: var(--secondary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-secondary {
            background: var(--gray);
            color: var(--white);
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .logout-details {
            background: var(--light);
            padding: 20px;
            border-radius: var(--radius-md);
            margin-bottom: 30px;
            text-align: left;
        }

        .logout-details h4 {
            margin: 0 0 10px 0;
            color: var(--dark);
            font-size: 16px;
        }

        .logout-details p {
            margin: 5px 0;
            font-size: 14px;
            color: var(--gray);
        }

        .logout-details p strong {
            color: var(--dark);
        }

        @media (max-width: 480px) {
            .logout-container {
                margin: 20px;
                padding: 30px 20px;
            }

            .logout-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <img src="../uninest-logo.png" alt="UniNest" width="64" height="64" style="object-fit: contain; margin-bottom: 14px;">
        <div class="logout-icon" aria-hidden="true"></div>
        <h1 class="logout-title">Signed out</h1>
        <p class="logout-message">
            Your UniNest Admin session has ended.
        </p>

        <div class="logout-actions">
            <a href="Login.html" class="btn btn-primary">
                Sign in again
            </a>
        </div>

        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--light);">
            <p style="font-size: 12px; color: var(--gray); margin: 0;">
                For security reasons, please close your browser if you're using a public computer.
            </p>
        </div>
    </div>

    <script>
        // Clear the Java session when this page is served through NetBeans/Tomcat.
        if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
            fetch('../../../LogoutServlet?portal=admin', {
                method: 'POST',
                credentials: 'same-origin',
                keepalive: true
            }).catch(function() {
                // Keep the page available if the session has already ended.
            });
        }

        // Auto-redirect to login page after 10 seconds
        let countdown = 10;
        const countdownElement = document.createElement('p');
        countdownElement.style.cssText = 'font-size: 14px; color: var(--gray); margin: 20px 0 0 0;';
        countdownElement.textContent = `Auto-redirecting to login page in ${countdown} seconds...`;

        document.querySelector('.logout-actions').appendChild(countdownElement);

        const countdownInterval = setInterval(() => {
            countdown--;
            countdownElement.textContent = `Auto-redirecting to login page in ${countdown} seconds...`;

            if (countdown <= 0) {
                clearInterval(countdownInterval);
                window.location.href = 'Login.html';
            }
        }, 1000);

        // Clear only session-scoped page data; browser-saved login details are preserved.
        sessionStorage.clear();
    </script>
  <script src="../../../system-status.js"></script>
</body>
</html>
