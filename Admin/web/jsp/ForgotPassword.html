<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../../csrf.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - UniNest Admin Portal</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main style="min-height: 100vh; display: grid; place-items: center; padding: 30px; background: var(--light);">
        <section style="width: min(460px, 100%); background: var(--white); padding: 30px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
            <img src="../uninest-logo.png" alt="UniNest" width="64" height="64" style="object-fit: contain; margin-bottom: 14px;">
            <h1 style="margin-bottom: 10px; color: var(--dark);">Reset Password</h1>
            <p style="color: var(--gray); margin-bottom: 20px;">Enter your account email to receive a password-reset link.</p>
            <form method="POST" action="../../../ForgotPasswordServlet">
                <label class="form-label required">Email Address</label>
                <input type="email" class="form-control" name="email" required>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 18px;">Request Reset</button>
            </form>
            <p style="margin-top: 18px;"><a href="Login.html">Back to login</a></p>
        </section>
    </main>
  <script src="../../../system-status.js"></script>
</body>
</html>
