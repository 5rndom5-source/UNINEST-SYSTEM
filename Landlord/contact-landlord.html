<!doctype html>
<html lang="en">
  <head>
  <script src="../csrf.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Landlord - UniNest</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="landlord-classic">
    <div class="classic-shell">
      <header class="classic-header">
        <a href="index.html" class="classic-brand">
          <img src="../createAccount/uninest-logo.png" alt="UniNest logo" />
          <span>
            <strong>UniNest</strong>
            <small>Student Accommodation Marketplace</small>
          </span>
        </a>

        <nav class="classic-nav" aria-label="Landlord navigation">
          <a href="index.html">Home</a>
          <a href="listings.html">Listings</a>
          <a href="booking-requests.html">Booking Requests</a>
          <a href="reviews.html">Reviews</a>
          <a href="profile.html">Profile</a>
          <a href="../LogoutServlet?portal=landlord">Logout</a>
        </nav>

        <div class="classic-actions">
          <button class="icon-btn classic-icon" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"></path>
              <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
            </svg>
          </button>
          <div class="profile-menu">
            <button class="profile-trigger classic-profile" type="button" aria-label="Open profile menu">
              <span class="avatar-sm">UN</span>
              <strong>Landlord Account</strong>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <div class="profile-dropdown">
              <a href="profile.html">View Profile</a>
                <a href="contact-landlord.html">Support</a>
              <a href="../LogoutServlet?portal=landlord">Logout</a>
            </div>
          </div>
        </div>
      </header>

      <main class="classic-content">
        <h1 class="classic-title">Support Messages</h1>

        <section class="classic-contact-layout">
          <div class="classic-landlord-card">
            <h2>Conversation History</h2>
            <div id="supportMessageList" class="support-message-list">
              <p>Loading messages...</p>
            </div>
          </div>

          <form
            id="contactLandlordForm"
            class="classic-contact-form"
            action="../ContactLandlordServlet"
            method="post"
            enctype="multipart/form-data"
          >
            <h2>New Support Message</h2>
            <label>
              Subject
              <input type="text" name="subject" placeholder="What do you need help with?" required />
            </label>
            <label>
              Message
              <textarea name="message" rows="8" placeholder="Describe the issue" required></textarea>
            </label>
            <label>
              Attachment (optional)
              <input name="attachment" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" />
              <small>JPG, PNG, WebP, or PDF. Maximum 5 MB.</small>
            </label>
            <div class="classic-buttons contact-buttons">
              <button type="submit" class="submit-btn">Send Message</button>
              <button type="reset" class="btn">Clear</button>
            </div>
          </form>
        </section>

        <div class="classic-message-success" id="messageSuccess">
          <span id="supportMessageStatus"></span>
        </div>
      </main>
    </div>

    <script>
      (() => {
        const context = window.location.pathname.match(/^\/[^/]+/)?.[0] || "";
        const list = document.getElementById("supportMessageList");
        const status = document.getElementById("messageSuccess");
        const statusText = document.getElementById("supportMessageStatus");
        const params = new URLSearchParams(window.location.search);
        const pageMessage = params.get("success") || params.get("error");
        if (pageMessage) {
          statusText.textContent = pageMessage;
          status.classList.add("show");
        }

        fetch(`${context}/ContactLandlordServlet`, { headers: { Accept: "application/json" }, cache: "no-store" })
          .then((response) => response.json().then((data) => ({ response, data })))
          .then(({ response, data }) => {
            if (!response.ok) throw new Error(data.error || "Messages could not be loaded");
            const messages = data.messages || [];
            list.replaceChildren();
            if (!messages.length) {
              list.textContent = "No support messages have been sent.";
              return;
            }
            messages.forEach((message) => {
              const item = document.createElement("article");
              item.className = "support-message";
              const heading = document.createElement("strong");
              heading.textContent = message.subject;
              const meta = document.createElement("span");
              meta.textContent = `${message.sender} to ${message.recipient} | ${message.createdAt}`;
              const body = document.createElement("p");
              body.textContent = message.body;
              item.append(heading, meta, body);
              if (message.attachmentUrl) {
                const attachment = document.createElement("a");
                attachment.className = "support-attachment";
                attachment.href = `${context}${message.attachmentUrl}`;
                attachment.target = "_blank";
                attachment.rel = "noopener";
                attachment.textContent = `Open attachment: ${message.attachmentName || "file"}`;
                item.appendChild(attachment);
              }
              const actions = document.createElement("div");
              actions.className = "support-message-actions";
              const state = document.createElement("small");
              state.textContent = message.mine ? (message.read ? "Read" : "Sent") : "Received";
              const remove = document.createElement("button");
              remove.type = "button";
              remove.textContent = "Delete";
              remove.addEventListener("click", async () => {
                if (!window.confirm("Delete this message? This cannot be undone.")) return;
                const body = new URLSearchParams({ messageId: message.id, action: "delete" });
                const response = await fetch(`${context}/MessageActionServlet`, {
                  method: "POST",
                  headers: { Accept: "application/json", "Content-Type": "application/x-www-form-urlencoded" },
                  body
                });
                if (response.ok) window.location.reload();
                else remove.textContent = "Failed";
              });
              actions.append(state, remove);
              item.appendChild(actions);
              list.appendChild(item);
            });
            if (window.uninestRefreshNotifications) window.uninestRefreshNotifications();
          })
          .catch((error) => {
            list.textContent = error.message;
          });
      })();
    </script>
    <script src="script.js"></script>
    <script src="../portal-identity.js?v=20260822-auth"></script>
    <script src="../system-status.js"></script>
</body>
</html>
